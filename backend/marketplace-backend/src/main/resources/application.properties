spring.application.name=marketplace-backend
# ===============================
# CONEXIÓN SQL SERVER LOCAL
# ===============================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=db_marketplace;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=2020

# ===============================
# JPA CONFIG
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ===============================
# SERVER CONFIG
# ===============================
server.port=8080