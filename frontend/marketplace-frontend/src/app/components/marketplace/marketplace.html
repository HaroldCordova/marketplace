<div class="container mt-4">
  <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
    <h2 class="m-0 fw-bold text-primary">🛍️ Marketplace</h2>

    <div class="d-flex gap-2">
      <input class="form-control" style="min-width: 260px"
             [(ngModel)]="searchTerm" placeholder="🔍 Buscar producto...">
      <select class="form-select w-auto" [(ngModel)]="sortBy">
        <option value="">Ordenar</option>
        <option value="price_asc">Precio: menor a mayor</option>
        <option value="price_desc">Precio: mayor a menor</option>
        <option value="name_asc">Nombre A-Z</option>
      </select>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-12 col-sm-6 col-md-4 col-lg-3" *ngFor="let p of productosFiltrados()">
      <div class="card h-100 producto-card">
        <div class="img-wrap">
          <img [src]="p.imagen" class="card-img-top" alt="{{p.nombre}}">
        </div>
        <div class="card-body d-flex flex-column">
          <h6 class="card-title fw-bold mb-1">{{ p.nombre }}</h6>
          <p class="text-muted small flex-grow-1">{{ p.descripcion }}</p>
          <div class="d-flex justify-content-between align-items-center">
            <span class="fw-bold text-success">S/ {{ p.precio }}</span>
            <button class="btn btn-primary btn-sm" (click)="agregarAlCarrito(p)">
              <i class="bi bi-cart-plus"></i> Añadir
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
