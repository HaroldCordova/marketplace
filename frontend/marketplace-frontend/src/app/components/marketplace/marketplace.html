<div class="container mt-4">
  <h2 class="text-center text-primary fw-bold mb-4">Marketplace Local</h2>

  <!-- Barra de búsqueda -->
  <div class="d-flex justify-content-center mb-4">
    <input
      type="text"
      class="form-control w-50"
      placeholder="🔍 Buscar productos..."
      [(ngModel)]="searchTerm"
    />
  </div>

  <!-- Lista de productos -->
  <div class="row g-4">
    <div
      class="col-12 col-sm-6 col-md-4 col-lg-3"
      *ngFor="let producto of productosFiltrados"
    >
      <div class="card h-100 shadow-sm border-0 producto-card">
        <img
          [src]="producto.imagen"
          class="card-img-top producto-img"
          alt="{{ producto.nombre }}"
        />
        <div class="card-body d-flex flex-column justify-content-between">
          <div>
            <h5 class="card-title text-dark fw-semibold">{{ producto.nombre }}</h5>
            <p class="card-text text-muted small">{{ producto.descripcion }}</p>
          </div>
          <div class="mt-2">
            <p class="fw-bold text-primary mb-2">S/ {{ producto.precio }}</p>
            <button
              class="btn btn-outline-primary w-100"
              (click)="agregarAlCarrito(producto)"
            >
              <i class="bi bi-cart-plus"></i> Agregar al carrito
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
