<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
  <div class="container">
    <!-- 🔹 Marca -->
    <a class="navbar-brand fw-bold text-primary" routerLink="/">
      <i class="bi bi-shop me-1 text-success"></i> Marketplace Local
    </a>

    <!-- 🔹 Botón menú móvil -->
    <button
      class="navbar-toggler border-0"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- 🔹 Navegación -->
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto align-items-center">

        <!-- Sección general -->
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            Inicio
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" routerLink="/marketplace" routerLinkActive="active">
            Productos
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" routerLink="/carrito" routerLinkActive="active">
            Carrito
            <span *ngIf="contadorCarrito > 0" class="badge bg-success ms-1">
              {{ contadorCarrito }}
            </span>
          </a>
        </li>

        <!-- Divider visual -->
        <li class="nav-item d-none d-lg-block mx-2 text-muted">|</li>

        <!-- 🧑‍🔧 Sección Vendedor -->
        <li class="nav-item dropdown" *ngIf="rol === 'vendedor'">
          <a
            class="nav-link dropdown-toggle fw-semibold text-primary"
            href="#"
            id="navbarDropdown"
            role="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            Vendedor
          </a>
          <ul
            class="dropdown-menu dropdown-menu-end shadow-sm"
            aria-labelledby="navbarDropdown"
          >
            <li>
              <a class="dropdown-item" routerLink="/vendedor/productos">
                <i class="bi bi-box-seam me-2 text-primary"></i> Mis productos
              </a>
            </li>
            <li>
              <a class="dropdown-item" routerLink="/vendedor/nuevo">
                <i class="bi bi-plus-circle me-2 text-success"></i> Agregar producto
              </a>
            </li>
            <li>
              <a class="dropdown-item" routerLink="/vendedor/formalizate">
                <i class="bi bi-file-earmark-text me-2 text-warning"></i> Formalízate
              </a>
            </li>
            <li><hr class="dropdown-divider" /></li>
            <li>
              <a class="dropdown-item" routerLink="/vendedor/panel">
                <i class="bi bi-speedometer2 me-2 text-secondary"></i> Panel del vendedor
              </a>
            </li>
          </ul>
        </li>

        <!-- 👑 Admin -->
        <li class="nav-item" *ngIf="rol === 'admin'">
          <a class="nav-link text-danger fw-semibold" routerLink="/admin/panel">
            <i class="bi bi-shield-lock-fill me-1"></i> Panel Admin
          </a>
        </li>

        <!-- 🛍️ Comprador -->
        <li class="nav-item" *ngIf="rol === 'comprador'">
          <a class="nav-link text-primary fw-semibold" routerLink="/marketplace">
            <i class="bi bi-bag-check-fill me-1"></i> Catálogo
          </a>
        </li>

        <!-- 🔹 Botón de acceso o cierre de sesión -->
        <li class="nav-item ms-lg-3" *ngIf="!rol">
          <a class="btn btn-outline-primary px-3 py-1" routerLink="/login">
            <i class="bi bi-person-circle me-1"></i> Acceso
          </a>
        </li>

        <li class="nav-item ms-lg-3" *ngIf="rol">
          <button class="btn btn-outline-danger px-3 py-1" (click)="logout()">
            <i class="bi bi-box-arrow-right me-1"></i> Cerrar sesión
          </button>
        </li>
      </ul>
    </div>
  </div>
</nav>
