<div class="login-container d-flex align-items-center justify-content-center vh-100">
  <div class="login-box shadow-lg">
    <div class="text-center mb-4">
      <div class="brand-icon mb-3">
        <i class="bi bi-bag-check-fill"></i>
      </div>
      <h2 class="fw-bold mb-1 text-dark">Marketplace Local</h2>
      <p class="text-muted">Bienvenido de nuevo 👋</p>
    </div>

    <form (ngSubmit)="iniciarSesion()">
      <div class="form-group mb-3">
        <label for="email" class="form-label fw-semibold">Correo electrónico</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="email"
          name="email"
          class="form-control modern-input"
          placeholder="ejemplo@gmail.com"
          required
        />
      </div>

      <div class="form-group mb-3">
        <label for="password" class="form-label fw-semibold">Contraseña</label>
        <input
          type="password"
          id="password"
          [(ngModel)]="password"
          name="password"
          class="form-control modern-input"
          placeholder="••••••••"
          required
        />
      </div>

      <div class="form-group mb-4">
        <label for="rol" class="form-label fw-semibold">Selecciona tu rol</label>
        <select
          id="rol"
          [(ngModel)]="rolSeleccionado"
          name="rolSeleccionado"
          class="form-select modern-input"
        >
          <option value="comprador">🛍️ Comprador</option>
          <option value="vendedor">🧑‍🔧 Vendedor</option>
          <option value="admin">⚙️ Administrador</option>
        </select>
      </div>

      <button type="submit" class="btn btn-modern w-100 fw-semibold">
        Iniciar sesión
      </button>
    </form>

    <p class="text-center mt-4 text-muted">
      ¿No tienes cuenta?
      <a routerLink="/registro" class="text-green fw-semibold text-decoration-none">
        Regístrate aquí
      </a>
    </p>
  </div>
</div>
