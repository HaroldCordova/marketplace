<div class="login-container d-flex align-items-center justify-content-center vh-100">
  <div class="login-box shadow-lg">
    <div class="text-center mb-4">
      <div class="brand-icon mb-3">
        <i class="bi bi-shop-window"></i>
      </div>
      <h2 class="fw-bold mb-1 text-dark">Marketplace Local</h2>
      <p class="text-muted">Inicia sesión según tu rol 👇</p>
    </div>

    <form (ngSubmit)="iniciarSesion()">
      <div class="form-group mb-3">
        <label for="email" class="form-label fw-semibold">Correo electrónico</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="email"
          name="email"
          class="form-control modern-input"
          placeholder="ejemplo@gmail.com"
          required
        />
      </div>

      <div class="form-group mb-3">
        <label for="password" class="form-label fw-semibold">Contraseña</label>
        <input
          type="password"
          id="password"
          [(ngModel)]="password"
          name="password"
          class="form-control modern-input"
          placeholder="••••••••"
          required
        />
      </div>

      <!-- 🔹 Selección de Rol -->
      <div class="form-group mb-4">
        <label class="form-label fw-semibold d-block mb-2">Selecciona tu rol</label>

        <div class="d-flex justify-content-around text-center">
          <div
            class="role-card p-3 rounded-3 border"
            [class.active]="rolSeleccionado === 'comprador'"
            (click)="rolSeleccionado = 'comprador'"
          >
            <i class="bi bi-bag-check-fill fs-3 text-primary mb-2"></i>
            <p class="fw-semibold mb-0">Comprador</p>
          </div>

          <div
            class="role-card p-3 rounded-3 border"
            [class.active]="rolSeleccionado === 'vendedor'"
            (click)="rolSeleccionado = 'vendedor'"
          >
            <i class="bi bi-tools fs-3 text-success mb-2"></i>
            <p class="fw-semibold mb-0">Vendedor</p>
          </div>

          <div
            class="role-card p-3 rounded-3 border"
            [class.active]="rolSeleccionado === 'admin'"
            (click)="rolSeleccionado = 'admin'"
          >
            <i class="bi bi-shield-lock-fill fs-3 text-danger mb-2"></i>
            <p class="fw-semibold mb-0">Administrador</p>
          </div>
        </div>
      </div>

      <button type="submit" class="btn btn-modern w-100 fw-semibold">
        Iniciar sesión
      </button>
    </form>

    <p class="text-center mt-4 text-muted">
      ¿No tienes cuenta?
      <a routerLink="/registro" class="text-green fw-semibold text-decoration-none">
        Regístrate aquí
      </a>
    </p>
  </div>
</div>
