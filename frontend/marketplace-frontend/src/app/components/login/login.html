<div class="login-page d-flex align-items-center justify-content-center">
  <div class="login-card shadow-lg">
    <div class="text-center mb-4">
      <div class="brand-icon mb-3 d-inline-flex align-items-center justify-content-center">
        <i class="bi bi-shop-window"></i>
      </div>
      <h2 class="fw-bold mb-1 text-dark">Marketplace Local</h2>
      <p class="text-muted mb-0">Inicia sesión para acceder a tu cuenta.</p>
    </div>

    <form (ngSubmit)="iniciarSesion()" autocomplete="off">
      <div class="mb-3">
        <label for="email" class="form-label fw-semibold">Correo electrónico</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="email"
          name="email"
          class="form-control modern-input"
          placeholder="ejemplo@gmail.com"
          required
        />
      </div>

      <div class="mb-4">
        <label for="password" class="form-label fw-semibold">Contraseña</label>
        <input
          type="password"
          id="password"
          [(ngModel)]="password"
          name="password"
          class="form-control modern-input"
          placeholder="••••••••"
          required
        />
      </div>

      <button type="submit" class="btn btn-primary w-100 fw-semibold login-btn">
        Iniciar sesión
      </button>
    </form>

    <!-- Texto con link al registro -->
    <p class="text-center mt-4 text-muted mb-0">
      ¿No tienes cuenta?
    </p>
    <p class="text-center mt-1 mb-0">
      <a
        routerLink="/registro"
        class="link-create-account fw-semibold text-decoration-none"
      >
        Crear cuenta como comprador o vendedor
      </a>
    </p>
  </div>
</div>
