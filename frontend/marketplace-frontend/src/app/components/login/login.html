<div class="login-wrapper d-flex justify-content-center align-items-center min-vh-100">
  <div class="card login-card shadow-lg border-0 p-4">
    <div class="text-center mb-3">
      <i class="bi bi-shop text-primary" style="font-size: 3rem;"></i>
      <h3 class="text-primary fw-bold mt-2">Marketplace Local</h3>
      <p class="text-muted">Bienvenido de nuevo, inicia sesión para continuar</p>
    </div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" autocomplete="off">
      <div class="mb-3">
        <label for="email" class="form-label fw-semibold">Correo electrónico</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input
            type="email"
            id="email"
            class="form-control"
            placeholder="ejemplo@gmail.com"
            required
            [(ngModel)]="email"
            name="email"
          />
        </div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label fw-semibold">Contraseña</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input
            type="password"
            id="password"
            class="form-control"
            placeholder="********"
            required
            [(ngModel)]="password"
            name="password"
          />
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 mt-3 py-2">
        <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar Sesión
      </button>

      <div class="text-center mt-3">
        <p class="text-muted mb-0">
          ¿No tienes cuenta?
          <a routerLink="/registro" class="text-decoration-none text-primary fw-semibold">Regístrate aquí</a>
        </p>
      </div>
    </form>
  </div>
</div>
