<div class="d-flex justify-content-center align-items-center vh-100 bg-light">
  <div class="card p-5 shadow-lg" style="width: 420px; border-radius: 15px;">
    <div class="text-center mb-4">
      <h3 class="text-primary fw-bold">Marketplace Local</h3>
      <p class="text-muted">Inicia sesión para continuar</p>
    </div>

    <form (ngSubmit)="iniciarSesion()">
      <div class="mb-3">
        <label for="email" class="form-label">Correo electrónico</label>
        <input type="email" id="email" [(ngModel)]="email" name="email" class="form-control" placeholder="ejemplo@gmail.com" required>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" id="password" [(ngModel)]="password" name="password" class="form-control" required>
      </div>

      <div class="mb-4">
        <label for="rol" class="form-label">Selecciona tu rol</label>
        <select id="rol" [(ngModel)]="rolSeleccionado" name="rolSeleccionado" class="form-select">
          <option value="comprador">🛍️ Comprador</option>
          <option value="vendedor">🧑‍🔧 Vendedor</option>
          <option value="admin">⚙️ Administrador</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary w-100">Iniciar sesión</button>
    </form>

    <p class="text-center mt-3 text-muted">
      ¿No tienes cuenta? <a routerLink="/registro" class="text-primary fw-semibold">Regístrate aquí</a>
    </p>
  </div>
</div>
