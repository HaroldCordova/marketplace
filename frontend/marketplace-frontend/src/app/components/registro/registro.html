<div class="auth-page d-flex align-items-center justify-content-center">
  <div class="auth-card shadow-lg">
    <div class="text-center mb-4">
      <div class="brand-icon mb-3 d-inline-flex align-items-center justify-content-center">
        <i class="bi bi-shop-window"></i>
      </div>
      <h2 class="fw-bold mb-1 text-dark">Crear cuenta</h2>
      <p class="text-muted mb-0">Regístrate para empezar a usar Marketplace Local.</p>
    </div>

    <form (ngSubmit)="registrar()" autocomplete="off">
      <div class="row">
        <div class="col-12 col-md-6 mb-3">
          <label class="form-label fw-semibold" for="nombre">Nombre</label>
          <input
            id="nombre"
            type="text"
            class="form-control modern-input"
            [(ngModel)]="nombre"
            name="nombre"
            required
          />
        </div>

        <div class="col-12 col-md-6 mb-3">
          <label class="form-label fw-semibold" for="apellido">Apellido</label>
          <input
            id="apellido"
            type="text"
            class="form-control modern-input"
            [(ngModel)]="apellido"
            name="apellido"
            required
          />
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold" for="correo">Correo electrónico</label>
        <input
          id="correo"
          type="email"
          class="form-control modern-input"
          [(ngModel)]="correo"
          name="correo"
          required
        />
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold" for="telefono">Teléfono (opcional)</label>
        <input
          id="telefono"
          type="tel"
          class="form-control modern-input"
          [(ngModel)]="telefono"
          name="telefono"
        />
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold" for="direccion">Dirección (opcional)</label>
        <input
          id="direccion"
          type="text"
          class="form-control modern-input"
          [(ngModel)]="direccion"
          name="direccion"
        />
      </div>

      <div class="row">
        <div class="col-12 col-md-6 mb-3">
          <label class="form-label fw-semibold" for="password">Contraseña</label>
          <input
            id="password"
            type="password"
            class="form-control modern-input"
            [(ngModel)]="password"
            name="password"
            required
          />
        </div>

        <div class="col-12 col-md-6 mb-4">
          <label class="form-label fw-semibold" for="confirmarPassword">Confirmar contraseña</label>
          <input
            id="confirmarPassword"
            type="password"
            class="form-control modern-input"
            [(ngModel)]="confirmarPassword"
            name="confirmarPassword"
            required
          />
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold d-block mb-2">Tipo de cuenta</label>

        <div class="d-flex gap-3 flex-wrap">
          <button
            type="button"
            class="btn role-pill"
            [class.active]="rol === 'comprador'"
            (click)="rol = 'comprador'"
          >
            <i class="bi bi-bag-check-fill me-2"></i>
            Comprador
          </button>

          <button
            type="button"
            class="btn role-pill"
            [class.active]="rol === 'vendedor'"
            (click)="rol = 'vendedor'"
          >
            <i class="bi bi-tools me-2"></i>
            Vendedor
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 fw-semibold auth-btn">
        Crear cuenta
      </button>
    </form>

   <p class="text-center mt-3 mb-0">
  ¿Ya tienes una cuenta?
  <a
    routerLink="/login"
    class="link-login fw-semibold text-decoration-none"
  >
    Inicia sesión aquí
  </a>
</p>
  </div>
</div>
