<div class="carrito-container">
  <div class="carrito-card">
    <h2 class="titulo-carrito">🛍️ Tu Carrito de Compras</h2>

    <table class="tabla-carrito">
      <thead>
        <tr>
          <th>Producto</th>
          <th>Precio (S/)</th>
          <th>Cantidad</th>
          <th>Subtotal (S/)</th>
          <th>Acción</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let p of carrito; let i = index">
          <td class="celda-nombre">{{ p.nombre }}</td>
          <td>{{ p.precio | number:'1.2-2' }}</td>
          <td>
            <input
              type="number"
              min="1"
              [(ngModel)]="p.cantidad"
              (change)="actualizarTotal()"
              (input)="actualizarTotal()"
            />
          </td>
          <td>{{ (p.precio * p.cantidad) | number:'1.2-2' }}</td>
          <td>
            <button class="btn-eliminar" (click)="eliminarDelCarrito(i)">✕</button>
          </td>
        </tr>
      </tbody>
    </table>

    <div class="resumen">
      <div class="total">
        Total: <span>S/ {{ total | number:'1.2-2' }}</span>
      </div>

      <!-- Botón solo visual, sin (click) para evitar errores -->
      <button class="btn-confirmar" [disabled]="!carrito.length">
        Confirmar compra
      </button>
    </div>
  </div>
</div>
