<div class="container mt-5">
  <h2 class="text-center mb-4 text-primary">🛒 Tu Carrito de Compras</h2>

  <div *ngIf="carrito.length > 0; else vacio">
    <table class="table table-striped table-hover align-middle shadow-sm rounded">
      <thead class="table-dark">
        <tr>
          <th>Producto</th>
          <th>Precio (S/)</th>
          <th>Cantidad</th>
          <th>Subtotal (S/)</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of carrito; let i = index">
          <td>{{ item.nombre }}</td>
          <td>{{ item.precio }}</td>
          <td>
            <input type="number" [(ngModel)]="item.cantidad" (change)="actualizarTotal()" min="1" class="form-control w-50">
          </td>
          <td>{{ item.precio * item.cantidad | number:'1.2-2' }}</td>
          <td>
            <button class="btn btn-danger btn-sm" (click)="eliminarDelCarrito(i)">❌</button>
          </td>
        </tr>
      </tbody>
    </table>

    <div class="d-flex justify-content-between align-items-center mt-4">
      <h4>Total: <span class="text-success fw-bold">S/ {{ total | number:'1.2-2' }}</span></h4>
      <button class="btn btn-success">Confirmar compra</button>
    </div>
  </div>

  <ng-template #vacio>
    <div class="alert alert-warning text-center mt-4">
      Tu carrito está vacío . <a routerLink="/marketplace">Explora productos aquí</a>.
    </div>
  </ng-template>
</div>
