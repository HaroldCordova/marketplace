<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold text-primary">📦 Mis Productos</h3>
    <a routerLink="/vendedor/nuevo" class="btn btn-success px-3">
      <i class="bi bi-plus-circle"></i> Nuevo Producto
    </a>
  </div>

  <!-- Estado cargando -->
  <div *ngIf="cargando" class="alert alert-secondary text-center">
    Cargando productos...
  </div>

  <!-- Tabla de productos -->
  <table
    class="table table-hover align-middle shadow-sm rounded"
    *ngIf="!cargando && productos.length > 0"
  >
    <thead class="table-light">
      <tr>
        <th>Imagen</th>
        <th>Nombre</th>
        <th>Precio (S/)</th>
        <th>Stock</th>
        <th>Categoría</th>
        <th class="text-center">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let p of productos">
        <td>
          <img
            [src]="p.imagenUrl || p.imagen || 'assets/img/producto-placeholder.jpg'"
            class="img-thumbnail"
            width="70"
            alt="Imagen producto"
          />
        </td>
        <td>{{ p.nombre }}</td>
        <td>S/ {{ p.precio | number : '1.2-2' }}</td>
        <td>{{ p.stock }}</td>
        <td>{{ p.categoriaNombre || p.nombreCategoria }}</td>
        <td class="text-center">
          <button
            class="btn btn-sm btn-outline-primary me-2"
            (click)="editarProducto(p)"
          >
            <i class="bi bi-pencil"></i>
          </button>
          <button
            class="btn btn-sm btn-outline-danger"
            (click)="eliminarProducto(p)"
          >
            <i class="bi bi-trash"></i>
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Sin productos -->
  <div *ngIf="!cargando && productos.length === 0" class="alert alert-info text-center mt-4">
    Aún no has subido productos.
    Haz clic en <strong>“Nuevo Producto”</strong> para publicar el primero.
  </div>
</div>
