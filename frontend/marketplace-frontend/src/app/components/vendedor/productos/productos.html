<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold text-primary">📦 Mis Productos</h3>
    <a routerLink="/vendedor/nuevo" class="btn btn-success px-3">
      <i class="bi bi-plus-circle"></i> Nuevo Producto
    </a>
  </div>

  <table class="table table-hover align-middle shadow-sm rounded">
    <thead class="table-light">
      <tr>
        <th>Imagen</th>
        <th>Nombre</th>
        <th>Precio (S/)</th>
        <th>Stock</th>
        <th>Categoría</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let p of productos">
        <td><img [src]="p.imagen" class="img-thumbnail" width="70" /></td>
        <td>{{ p.nombre }}</td>
        <td>S/ {{ p.precio }}</td>
        <td>{{ p.stock }}</td>
        <td>{{ p.categoria }}</td>
        <td>
          <button class="btn btn-sm btn-outline-primary me-2" (click)="editarProducto(p)">
            <i class="bi bi-pencil"></i>
          </button>
          <button class="btn btn-sm btn-outline-danger" (click)="eliminarProducto(p)">
            <i class="bi bi-trash"></i>
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="productos.length === 0" class="alert alert-info text-center mt-4">
    Aún no has subido productos.
  </div>
</div>
