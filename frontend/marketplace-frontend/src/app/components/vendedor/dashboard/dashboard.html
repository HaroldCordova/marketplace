<div class="d-flex vh-100">
  <!-- 🟣 Panel lateral -->
  <div class="sidebar bg-dark text-white p-3">
    <h4 class="text-center mb-4">Vendedor</h4>
    <ul class="nav flex-column">
      <li class="nav-item" *ngFor="let item of menu">
        <a [routerLink]="item.ruta" class="nav-link text-white d-flex align-items-center mb-2">
          <i class="{{ item.icono }} me-2"></i>
          <span>{{ item.titulo }}</span>
        </a>
      </li>
    </ul>
  </div>

  <!-- 🟢 Contenido principal -->
  <div class="content flex-grow-1 p-4 bg-light overflow-auto">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="fw-bold text-primary">Panel de Vendedor</h3>
      <button class="btn btn-outline-danger">Cerrar sesión</button>
    </div>

    <!-- Tarjetas estadísticas -->
    <div class="row mb-4">
      <div class="col-md-4" *ngFor="let card of [
        {icon:'bi-bag', title:'Ventas Hoy', value:'S/ 480'},
        {icon:'bi-box', title:'Productos Activos', value:'12'},
        {icon:'bi-cash-stack', title:'Ganancia Total', value:'S/ 3200'}
      ]">
        <div class="card shadow-sm border-0 rounded-4 p-3">
          <div class="d-flex align-items-center">
            <i class="{{card.icon}} fs-3 text-primary me-3"></i>
            <div>
              <h6 class="text-muted mb-1">{{ card.title }}</h6>
              <h5 class="fw-bold">{{ card.value }}</h5>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 📘 Módulo Formalízate integrado -->
    <app-formalizate></app-formalizate>

    <router-outlet></router-outlet>
  </div>
</div>
