<div class="card shadow-sm border-0 rounded-4 p-4 mb-4">
  <h4 class="fw-bold text-primary mb-3">📘 Formalízate</h4>
  <p class="text-muted">
    Avanza paso a paso hacia la formalización de tu emprendimiento.  
    Cada paso completado te acerca a más beneficios dentro del Marketplace.
  </p>

  <!-- Barra de progreso -->
  <div class="progress my-3" style="height: 20px;">
    <div class="progress-bar bg-success" role="progressbar" [style.width.%]="progreso">
      {{ progreso }}%
    </div>
  </div>

  <!-- Lista de pasos -->
  <ul class="list-group">
    <li class="list-group-item d-flex justify-content-between align-items-start" *ngFor="let paso of pasos">
      <div>
        <h6 class="fw-bold">{{ paso.titulo }}</h6>
        <p class="text-muted small">{{ paso.descripcion }}</p>
        <a [href]="paso.link" target="_blank" class="text-primary small">Ver más</a>
      </div>
      <button class="btn btn-outline-success btn-sm" (click)="togglePaso(paso)">
        <i class="bi" [ngClass]="paso.completado ? 'bi-check-circle-fill text-success' : 'bi-circle'"></i>
      </button>
    </li>
  </ul>
</div>
